name: pnote
description: "手机日记本 - 私人多媒体日记"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # 状态管理
  flutter_riverpod: ^2.6.1

  # 本地数据库 (Drift / SQLite)
  drift: ^2.21.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.4
  path: ^1.9.0

  # 媒体
  image_picker: ^1.1.2
  flutter_image_compress: ^2.3.0

  # 设置持久化
  shared_preferences: ^2.3.2

  # 工具
  intl: ^0.19.0
  uuid: ^4.5.1
  collection: ^1.18.0
  device_info_plus: ^11.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Drift 代码生成
  drift_dev: ^2.21.0
  build_runner: ^2.4.13

flutter:
  uses-material-design: true
